services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: archives
      POSTGRES_USER: archives
      POSTGRES_PASSWORD: archives_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:v1.12.5
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  minio:
    image: minio/minio:RELEASE.2025-02-18T16-25-55Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: archives
      MINIO_ROOT_PASSWORD: archives_dev
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  ai-service:
    build: ./services/ai-service
    environment:
      PORT: 8000
      QDRANT_URL: http://qdrant:6333
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: mistral
      EMBEDDING_MODEL: nomic-embed-text
    ports:
      - "8000:8000"
    depends_on:
      - qdrant

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    environment:
      PORT: 3000
      AI_SERVICE_URL: http://ai-service:8000
      DATABASE_URL: postgresql://archives:archives_dev@postgres:5432/archives
      OLLAMA_URL: http://host.docker.internal:11434
      QDRANT_URL: http://qdrant:6333
      REQUEST_MODELS_DIR: /app/modeles_pdf
    ports:
      - "3000:3000"
    volumes:
      - ./apps/backend:/app
      - ./modeles_pdf:/app/modeles_pdf:ro
      - backend_node_modules:/app/node_modules
      - uploads_data:/app/uploads
    depends_on:
      - ai-service
      - postgres

  frontend:
    build: ./apps/frontend
    environment:
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "5173:5173"
    volumes:
      - ./apps/frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
  qdrant_data:
  minio_data:
  uploads_data:
  frontend_node_modules:
  backend_node_modules: